name: Android CI Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: android-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Write build metadata
        env:
          BUILD_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          mkdir -p app/src/main/assets
          printf '%s' "$BUILD_COMMIT" > app/src/main/assets/build_commit.txt

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.3.0
        with:
          gradle-version: wrapper
          # Same-repository PRs may populate the cache. Fork PRs remain read-only.
          cache-read-only: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Verify Material 3 Expressive UI
        run: python3 scripts/check_m3e_ui.py

      - name: Build with Gradle
        run: ./gradlew assembleDebug testDebugUnitTest -x lint

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
