name: Complete M3E Migration

on:
  push:
    branches: [ "dev" ]
    paths:
      - '.github/workflows/complete-m3e.yml'

permissions:
  contents: write

jobs:
  migrate-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: dev
          fetch-depth: 0

      - uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v6.3.0
        with:
          gradle-version: wrapper

      - name: Apply migration
        run: |
          python3 scripts/migrate_m3e_once.py
          python3 scripts/fix_home_pull_refresh_once.py

      - name: Write build metadata
        run: |
          mkdir -p app/src/main/assets
          printf '%s' "$(git rev-parse HEAD)" > app/src/main/assets/build_commit.txt

      - name: Verify M3E audit
        run: python3 scripts/check_m3e_ui.py

      - name: Build and test
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug testDebugUnitTest -x lint

      - name: Commit verified migration
        run: |
          rm -f app/src/main/assets/build_commit.txt
          git rm .github/workflows/complete-m3e.yml scripts/migrate_m3e_once.py scripts/fix_home_pull_refresh_once.py
          git add app/src/main/java/com/atuy/scomb/ui scripts/check_m3e_ui.py .github/workflows/android-ci.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Material 3 Expressiveコンポーネント移行を完了'
          git push origin HEAD:dev
