name: Fix Settings Expressive CI

on:
  push:
    branches: [ "dev" ]
    paths:
      - "scripts/fix_settings_build_info.py"
      - ".github/workflows/fix-settings-ci.yml"

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: dev
          fetch-depth: 0

      - uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: temurin

      - uses: gradle/actions/setup-gradle@v6.3.0
        with:
          gradle-version: wrapper
          cache-read-only: false

      - name: Apply fix
        run: python3 scripts/fix_settings_build_info.py

      - name: Write build metadata
        run: |
          mkdir -p app/src/main/assets
          printf '%s' "$(git rev-parse HEAD)" > app/src/main/assets/build_commit.txt

      - name: Build and test
        run: ./gradlew assembleDebug testDebugUnitTest -x lint

      - name: Commit verified fix
        run: |
          rm scripts/fix_settings_build_info.py .github/workflows/fix-settings-ci.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "設定画面のExpressive実装とビルド情報表示を修正"
          git push origin HEAD:dev
